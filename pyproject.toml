[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oddsbot"
version = "0.1.0"
description = "Value betting toolkit"
authors = [{name="Example", email="example@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "tenacity",
    "pydantic",
    "pandas",
    "numpy",
    "sqlmodel",
    "python-dotenv",
    "PyYAML",
    "click",
    "streamlit",
    "plotly",
    "rich",
    "watchdog",
]
